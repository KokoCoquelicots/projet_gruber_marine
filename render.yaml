services:
  - type: web
    name: vigie-api
    runtime: node
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://vigie.onrender.com
  - type: web
    name: vigie
    runtime: static
    rootDir: front
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/front/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html