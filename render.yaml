databases:
  - name: vigie-db
    databaseName: vigie
    user: vigie
    plan: free

services:
  - type: web
    name: vigie-api
    runtime: node
    rootDir: api
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://vigie-c9tg.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: vigie-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
  - type: web
    name: vigie
    runtime: static
    rootDir: front
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/front/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html